name: CI

on:
    workflow_dispatch:
    push:
        branches:
            - main 
    pull_request:
        branches:
            - main

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7

            - name: Install Python
              uses: actions/setup-python@v7
              with:
                python-version: '3.15'

            - name: Install dependencies
              run: |
                python -m pip install -U pip wheel
                pip install -e ".[dev]"

            - name: Quick CLE smoke test
              run: |
                units-convert --help || (echo "CLI missing" && exit 1)

            - name: Run test
              run: pytest
            